<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://firestore.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self'; img-src 'self' data:;">
    <title>Smart TV Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="safe-zone">
      <header>
        <img src="logo.png" width="56" height="56" alt="Top Tournaments">
        <div>
          <p class="eyebrow">TOP TOURNAMENTS</p>
          <h1>Panel de rendimiento</h1>
        </div>
        <p id="connection-status" class="status" aria-live="polite">Conectando...</p>
    </header>
    <section class="grid" aria-label="Métricas y vistas">
      <button class="card focused" data-view="ritmo"><span class="label">Ritmo</span><strong id="tv-ritmo">0</strong><span class="unit">BPM</span></button>
      <button class="card" data-view="pasos"><span class="label">Pasos</span><strong id="tv-pasos">0</strong><span class="unit">ACUMULADOS</span></button>
      <button class="card" data-view="calorias"><span class="label">Calorías</span><strong id="tv-calorias">0</strong><span class="unit">KCAL</span></button>
      <button class="card" data-view="estado"><span class="label">Estado del torneo</span><strong id="tv-estado">EN VIVO</strong><span class="unit">DATOS ACTUALIZADOS</span></button>
    </section>
    <footer><span id="last-update">Esperando datos...</span><span>Foco: <b id="focus-name">Ritmo</b></span></footer>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
